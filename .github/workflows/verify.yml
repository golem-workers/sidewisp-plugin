name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - run: npm install --global openclaw@2026.7.1-2
      - run: ./scripts/verify-release.sh
  signed-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Verify immutable version tag
        run: |
          package_version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${package_version}"
          git show-ref --verify --quiet "refs/tags/${GITHUB_REF_NAME}"
          test "$(git rev-list -n 1 "${GITHUB_REF_NAME}")" = "$(git rev-parse HEAD)"
      - name: Build release tarball
        run: mkdir -p dist && npm pack --pack-destination dist
      - name: Record digest
        run: cd dist && sha256sum *.tgz > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tgz
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tgz dist/SHA256SUMS \
            --verify-tag \
            --title "Sidewisp Plugin ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
  promote-production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: signed-release
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Download and promote verified release
        env:
          GH_TOKEN: ${{ github.token }}
          SIDEWISP_PRODUCTION_HOST: ${{ vars.SIDEWISP_PRODUCTION_HOST }}
          SIDEWISP_PRODUCTION_USER: ${{ vars.SIDEWISP_PRODUCTION_USER }}
          SIDEWISP_PRODUCTION_SSH_KEY: ${{ secrets.SIDEWISP_PRODUCTION_SSH_KEY }}
          SIDEWISP_PRODUCTION_KNOWN_HOSTS: ${{ secrets.SIDEWISP_PRODUCTION_KNOWN_HOSTS }}
        run: |
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" \
            --pattern "sidewisp-plugin-*.tgz" \
            --pattern SHA256SUMS \
            --dir dist
          (cd dist && sha256sum --check SHA256SUMS)
          version="${GITHUB_REF_NAME#v}"
          sha=$(awk 'NF == 2 && $2 ~ /sidewisp-plugin-.*\\.tgz$/ { print $1 }' dist/SHA256SUMS)
          test -n "$sha"
          ./scripts/promote-production.sh "$version" "$sha"
